name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare offline web files (www/)
        run: node scripts/prepare-www.js

      - name: Create Android project
        run: npx cap add android

      - name: App icon + splash
        run: npx capacitor-assets generate --android

      - name: Kiosk tweaks (fullscreen, keep awake, music autoplay)
        run: cp scripts/MainActivity.java android/app/src/main/java/com/gemcor/pressittowin/MainActivity.java

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PressItToWinIt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
