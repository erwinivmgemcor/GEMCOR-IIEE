<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMCOR x IIEE Cyber Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #02060a;
            --gemcor-blue: #0055ff;
            --gemcor-green: #00ff88;
            --neon-blue: #00e1ff;
            --neon-green: #39ff14;
            --danger: #ff003c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; 
            user-select: none; 
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair; 
        }

        /* Interactive Canvas */
        #bg-canvas, #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Red Glitch Overlay for Wrong Answer */
        #glitch-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 60, 0.2);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 850px;
            height: 92%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid rgba(0, 225, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 85, 255, 0.15), inset 0 0 40px rgba(0, 255, 136, 0.05);
            border-radius: 30px;
            padding: 40px;
            background: rgba(2, 6, 10, 0.75); 
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            pointer-events: none; 
            transition: all 0.2s;
        }

        button, .logo-container, #question-text, #result-text, .options-grid {
            pointer-events: auto;
        }

        .container.shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        .container.glitch-bg { background: rgba(255, 0, 60, 0.1); border-color: var(--danger); box-shadow: 0 0 80px var(--danger); }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* LOGO & TYPOGRAPHY */
        .logo-container { margin-bottom: 20px; animation: floatLogo 4s ease-in-out infinite; }
        .logo-container img { max-width: 350px; height: auto; filter: drop-shadow(0 0 20px rgba(0, 225, 255, 0.5)); }
        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: white;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 30px var(--gemcor-blue);
            margin: 0 0 10px 0;
            letter-spacing: 4px;
        }
        .highlight-green { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green), 0 0 40px var(--gemcor-green); }

        /* BUTTONS */
        .btn {
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            color: var(--neon-green);
            border: 2px solid var(--gemcor-green);
            padding: 20px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }
        .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: all 0.5s; }
        .btn:hover::before { left: 100%; }
        .btn:active { background: var(--gemcor-green); color: black; transform: scale(0.92); box-shadow: 0 0 60px var(--neon-green); }

        .hidden { display: none !important; }

        /* QUESTIONS UI */
        #question-text { font-family: 'Rajdhani', sans-serif; font-size: 2.8rem; margin-bottom: 40px; font-weight: 700; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; }
        .option-btn {
            background: rgba(0, 85, 255, 0.1);
            border: 2px solid rgba(0, 225, 255, 0.4);
            color: white;
            padding: 25px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .option-btn:hover { background: rgba(0, 85, 255, 0.3); border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 225, 255, 0.3); }
        .option-btn span { font-family: 'Orbitron', sans-serif; background: var(--gemcor-blue); color: white; border-radius: 8px; width: 45px; height: 45px; display: inline-flex; justify-content: center; align-items: center; margin-right: 20px; font-weight: bold; box-shadow: 0 0 10px var(--neon-blue); flex-shrink: 0; }
        .option-btn:active { transform: scale(0.98); background: var(--gemcor-blue); }

        /* RESULTS UI */
        #result-screen h1 { font-size: 7rem; margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 900; }
        .correct-text { color: var(--neon-green); text-shadow: 0 0 30px var(--neon-green), 0 0 80px var(--gemcor-green); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .wrong-text { color: var(--danger); text-shadow: 0 0 30px var(--danger), 0 0 80px var(--danger); animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Background & Effects Canvases -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="fx-canvas" style="z-index: 6; pointer-events: none;"></canvas>
    <div id="glitch-overlay"></div>

    <div class="container" id="main-container">
        <div class="logo-container">
            <img src="https://github.com/erwinivmgemcor/GEMCOR-IIEE/blob/main/gemcor-logo.png?raw=true" alt="GEMCOR Logo">
        </div>

        <!-- ATTRACT SCREEN -->
        <div id="attract-screen">
            <h1>CYBER <span class="highlight-green">QUIZ</span></h1>
            <p style="font-size: 1.5rem; color: #aaa; letter-spacing: 2px;">SYSTEM READY. TAP ANYWHERE.</p>
            <button class="btn" onclick="startGame()">INITIALIZE</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="hidden" style="width: 100%;">
            <h2 style="color: var(--neon-blue); font-family: 'Orbitron'; font-size: 1.2rem; letter-spacing: 4px; margin-top:0;">DATA REQUEST</h2>
            <div id="question-text">Loading...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="hidden">
            <h1 id="result-text">CORRECT!</h1>
            <p id="result-subtext" style="font-size: 2rem; color: white; margin-top: 20px;">Claim your prize at the booth!</p>
            <button class="btn" onclick="resetGame()" style="margin-top: 50px;">NEXT PLAYER</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. BACKGROUND (CIRCUIT & TOUCH RIPPLES)
        // ==========================================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let pulses = [];
        const PARTICLE_COUNT = 80;
        const CONNECTION_DISTANCE = 150;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8; 
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1.5;
                this.baseColor = Math.random() > 0.3 ? '#0055ff' : '#00ff88';
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.baseColor; ctx.shadowBlur = 15; ctx.shadowColor = this.baseColor; ctx.fill(); ctx.shadowBlur = 0; 
            }
        }

        class Pulse {
            constructor(x, y) {
                this.x = x; this.y = y; this.radius = 0;
                this.maxRadius = Math.random() * 150 + 100;
                this.opacity = 1; this.speed = 4;
                this.color = Math.random() > 0.5 ? '0, 255, 136' : '0, 225, 255';
            }
            update() { this.radius += this.speed; this.opacity -= 0.03; }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.lineWidth = 3; ctx.shadowBlur = 20; ctx.shadowColor = `rgba(${this.color}, ${this.opacity})`;
                ctx.stroke(); ctx.shadowBlur = 0;
            }
        }

        function animateCanvas() {
            ctx.fillStyle = 'rgba(2, 6, 10, 0.3)'; ctx.fillRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < CONNECTION_DISTANCE) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 85, 255, ${(1 - (distance / CONNECTION_DISTANCE)) * 0.6})`;
                        ctx.lineWidth = 1; ctx.stroke();
                    }
                }
            }
            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update(); pulses[i].draw();
                if (pulses[i].opacity <= 0) pulses.splice(i, 1);
            }
            requestAnimationFrame(animateCanvas);
        }

        function createPulse(e) {
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            let y = e.touches ? e.touches[0].clientY : e.clientY;
            pulses.push(new Pulse(x, y));
            setTimeout(() => pulses.push(new Pulse(x, y)), 100);
            particles.forEach(p => {
                const dx = p.x - x, dy = p.y - y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) { p.vx += (dx / dist) * 2; p.vy += (dy / dist) * 2; }
            });
        }

        window.addEventListener('mousedown', createPulse);
        window.addEventListener('touchstart', createPulse);
        window.addEventListener('resize', initCanvas);
        initCanvas(); animateCanvas();

        // ==========================================
        // 2. CONFETTI EFFECT (FOR CORRECT ANSWER)
        // ==========================================
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        let confetti = [];
        let isConfettiActive = false;

        function resizeFx() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFx);
        resizeFx();

        class ConfettiPiece {
            constructor() {
                this.x = Math.random() * fxCanvas.width;
                this.y = -20; // Start above screen
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 5 + 3;
                this.speedX = (Math.random() - 0.5) * 4;
                this.color = ['#00ff88', '#0055ff', '#00e1ff', '#ffffff'][Math.floor(Math.random() * 4)];
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 10;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
            }
            draw() {
                fxCtx.save();
                fxCtx.translate(this.x, this.y);
                fxCtx.rotate(this.rotation * Math.PI / 180);
                fxCtx.fillStyle = this.color;
                fxCtx.shadowBlur = 10;
                fxCtx.shadowColor = this.color;
                fxCtx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                fxCtx.restore();
            }
        }

        function startConfetti() {
            confetti = [];
            isConfettiActive = true;
            for (let i = 0; i < 150; i++) confetti.push(new ConfettiPiece());
            animateConfetti();
        }

        function animateConfetti() {
            if (!isConfettiActive) return;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            let activePieces = false;
            confetti.forEach((p, index) => {
                p.update(); p.draw();
                if (p.y < fxCanvas.height) activePieces = true;
            });
            // Filter out pieces that fell off screen
            confetti = confetti.filter(p => p.y < fxCanvas.height);
            
            if (confetti.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                isConfettiActive = false;
                fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            }
        }

        // ==========================================
        // 3. AUDIO SYNTHESIZER (MUSIC & SFX)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicInterval;

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            // Arpeggio effect (C major chord)
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
            osc.start(); osc.stop(audioCtx.currentTime + 1.0);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            // Harsh buzz
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // Cyberpunk Ambient Music (Synthwave Loop)
        function startAmbientMusic() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (musicInterval) return; // Huwag i-double start

            const notes = [130.81, 130.81, 155.56, 174.61, 130.81, 155.56, 196.00, 174.61]; // C minor progression
            let noteIndex = 0;

            musicInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();

                osc.type = 'square'; // Retro synth sound
                filter.type = 'lowpass';
                filter.frequency.value = 400; // Makes it sound muffled and background-ish

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.frequency.setValueAtTime(notes[noteIndex], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // Mahina lang (Background)
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 300); // Bilis ng beat
        }

        // ==========================================
        // 4. GAME LOGIC
        // ==========================================
        const questions = [
            { q: "What does IIEE stand for?", o: ["Institute of Integrated Electrical Engineers", "International Institute of Electrical Engineering", "Integrated Institute of Electronic Engineers", "Institute of Industrial Electrical Engineers"], a: 0 },
            { q: "Which of the following is the unit of electrical resistance?", o: ["Volt", "Ampere", "Ohm", "Watt"], a: 2 },
            { q: "What is the color of the live wire in standard electrical wiring?", o: ["Black", "Green", "White", "Red or Brown"], a: 3 },
            { q: "Who discovered the principle of electromagnetic induction?", o: ["Thomas Edison", "Nikola Tesla", "Michael Faraday", "James Watt"], a: 2 },
            { q: "What is the standard frequency of AC power in the Philippines?", o: ["50 Hz", "60 Hz", "70 Hz", "100 Hz"], a: 1 },
            { q: "Which material is a good conductor of electricity?", o: ["Rubber", "Wood", "Copper", "Glass"], a: 2 },
            { q: "What does GEMCOR stand for?", o: ["General Electric Motor Corp", "Greenmetal Electric Manufacturing Corporation", "Global Electrical Machinery Corp", "Green Energy Machine Corp"], a: 1 },
            { q: "What is the formula for Ohm's Law?", o: ["V = I / R", "V = I * R", "V = R / I", "V = I + R"], a: 1 },
            { q: "Which device is used to protect an electrical circuit from overload?", o: ["Capacitor", "Resistor", "Circuit Breaker", "Inductor"], a: 2 },
            { q: "What is the safe voltage limit for dry environments according to Philippine Electrical Code?", o: ["12V", "24V", "50V", "110V"], a: 2 }
        ];

        let currentQuestion = null;
        const attractScreen = document.getElementById('attract-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const resultText = document.getElementById('result-text');
        const resultSubtext = document.getElementById('result-subtext');
        const mainContainer = document.getElementById('main-container');
        const glitchOverlay = document.getElementById('glitch-overlay');

        function startGame() {
            startAmbientMusic(); // Start background music on first interaction
            
            attractScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            const randomIndex = Math.floor(Math.random() * questions.length);
            currentQuestion = questions[randomIndex];
            loadQuestion();
        }

        function loadQuestion() {
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            mainContainer.classList.remove('shake', 'glitch-bg');
            glitchOverlay.style.opacity = 0;

            questionText.innerText = "";
            let i = 0;
            const txt = currentQuestion.q;
            
            function typeWriter() {
                if (i < txt.length) {
                    questionText.innerHTML += txt.charAt(i);
                    i++;
                    setTimeout(typeWriter, 20);
                }
            }
            typeWriter();
            
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            setTimeout(() => {
                currentQuestion.o.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${letters[index]}</span> ${option}`;
                    btn.onclick = () => checkAnswer(index);
                    optionsContainer.appendChild(btn);
                });
            }, 500); 
        }

        function checkAnswer(selectedIndex) {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            if (selectedIndex === currentQuestion.a) {
                // TAMA
                playCorrectSound();
                startConfetti(); // Ipapasa ang confetti
                resultText.innerText = "CORRECT!";
                resultText.className = "correct-text";
                resultSubtext.innerText = "Great job! Please claim your souvenir at the GEMCOR booth.";
                resultSubtext.style.color = "white";
            } else {
                // MALI
                playWrongSound();
                
                // Glitch Effect
                glitchOverlay.style.opacity = 1;
                setTimeout(() => glitchOverlay.style.opacity = 0, 200);
                
                resultText.innerText = "WRONG!";
                resultText.className = "wrong-text";
                resultSubtext.innerText = "Better luck next time!";
                resultSubtext.style.color = "#aaa";
                
                mainContainer.classList.add('shake', 'glitch-bg'); 
            }
        }

        function resetGame() {
            resultScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            attractScreen.classList.remove('hidden');
            mainContainer.classList.remove('shake', 'glitch-bg');
            glitchOverlay.style.opacity = 0;
            currentQuestion = null;
            isConfettiActive = false;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        }
    </script>
</body>
</html>
