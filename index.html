<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMCOR x IIEE - Knowledge Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #02060a;
            --gemcor-blue: #0055ff;
            --gemcor-green: #00ff88;
            --neon-blue: #00e1ff;
            --neon-green: #39ff14;
            --danger: #ff003c;
            --warning: #ffcc00;
            --text-glow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden; user-select: none; 
            height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center;
            cursor: crosshair; 
        }

        #bg-canvas, #fx-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        #glitch-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 60, 0.3); z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.1s;
        }

        /* --- SETTINGS UI --- */
        .settings-btn {
            position: absolute; top: 20px; right: 20px; z-index: 20;
            background: rgba(0, 85, 255, 0.1); border: 2px solid var(--neon-blue); color: var(--neon-blue);
            border-radius: 50%; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: 0.3s;
        }
        .settings-btn:hover { background: rgba(0, 225, 255, 0.3); transform: rotate(90deg); }

        #settings-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 400px; background: rgba(2, 6, 10, 0.95); border: 1px solid var(--gemcor-blue);
            border-radius: 10px; padding: 30px; z-index: 30; box-shadow: 0 0 50px rgba(0, 85, 255, 0.3);
            display: none; flex-direction: column; gap: 20px; font-family: 'Share Tech Mono', monospace;
        }
        #settings-modal h2 { margin: 0; color: var(--neon-blue); text-align: center; letter-spacing: 2px; font-size: 1.5rem; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; }
        
        input[type=range] { -webkit-appearance: none; width: 150px; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 15px; width: 15px; border-radius: 50%; background: var(--neon-blue); cursor: pointer; margin-top: -5px; box-shadow: 0 0 10px var(--neon-blue); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px; }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--gemcor-blue); }
        input:checked + .slider:before { transform: translateX(24px); }
        .close-btn { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 10px; font-family: 'Share Tech Mono'; border-radius: 5px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .close-btn:hover { background: var(--neon-blue); color: black; }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative; z-index: 10; width: 90%; max-width: 900px; height: 92%;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            border: 1px solid rgba(0, 225, 255, 0.1); box-shadow: inset 0 0 60px rgba(0, 85, 255, 0.05);
            border-radius: 5px; padding: 40px; background: rgba(2, 6, 10, 0.85);
            box-sizing: border-box; pointer-events: none; transition: all 0.2s;
        }
        
        .container::before, .container::after { content: ''; position: absolute; width: 30px; height: 30px; border: 2px solid var(--gemcor-blue); pointer-events: none; }
        .container::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .container::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        button, .logo-container, #question-text, #result-text, .options-grid, .settings-btn, #settings-modal, .hold-btn-container { pointer-events: auto; }

        .container.shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }
        .container.glitch-bg { background: rgba(255, 0, 60, 0.1); border-color: var(--danger); box-shadow: 0 0 80px var(--danger); }
        .container.success-bg { background: rgba(0, 255, 136, 0.05); border-color: var(--neon-green); box-shadow: 0 0 80px var(--neon-green); }

        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

        /* --- ENHANCED LOGO CONTAINER --- */
        .logo-container { 
            margin-bottom: 30px; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 225, 255, 0.15);
            border-radius: 15px;
            padding: 15px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 225, 255, 0.05);
            backdrop-filter: blur(10px);
            animation: floatLogo 4s ease-in-out infinite, logoGlow 4s ease-in-out infinite;
        }

        .logo-container img { 
            max-width: 280px; 
            height: auto; 
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 166, 81, 0.4));
        }

        @keyframes floatLogo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 225, 255, 0.05); border-color: rgba(0, 225, 255, 0.15); }
            50% { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 166, 81, 0.15); border-color: rgba(0, 166, 81, 0.4); }
        }

        /* --- PROFESSIONAL TITLE --- */
        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: clamp(1.8rem, 3.5vw, 2.5rem); 
            color: white; 
            text-shadow: 0 0 20px var(--gemcor-blue); 
            margin: 0 0 5px 0; 
            letter-spacing: 4px; 
            font-weight: 700; 
            text-transform: uppercase;
        }
        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-green);
            font-size: clamp(0.9rem, 1.2vw, 1.2rem);
            letter-spacing: 5px;
            margin-bottom: 0;
            display: block;
        }

        /* --- HIGH-END PRESS AND HOLD BUTTON --- */
        .hold-btn-container {
            position: relative; 
            width: clamp(200px, 22vw, 280px); 
            height: clamp(200px, 22vw, 280px); 
            margin: 40px auto 0 auto;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        
        .hud-ring-outer { position: absolute; width: 100%; height: 100%; border: 1px dashed rgba(0, 225, 255, 0.3); border-radius: 50%; animation: rotateHUD 20s linear infinite; pointer-events: none; }
        .hud-ring-inner { position: absolute; width: 82%; height: 82%; border: 2px solid rgba(0, 85, 255, 0.2); border-radius: 50%; border-top-color: var(--neon-blue); border-bottom-color: var(--neon-blue); pointer-events: none; }
        
        @keyframes rotateHUD { 100% { transform: rotate(360deg); } }

        .progress-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); z-index: 2; pointer-events: none;}
        .progress-ring__circle { stroke-dasharray: 1000; stroke-dashoffset: 1000; stroke-linecap: round; transition: stroke-dashoffset 0.05s linear; }

        .laser-scanner {
            position: absolute; width: 60%; height: 2px; background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
            top: 50%; left: 20%; transform: translateY(-50%); opacity: 0; z-index: 3; pointer-events: none;
        }
        .hold-btn-container:active .laser-scanner, .hold-btn-container.scanning .laser-scanner { opacity: 1; animation: scanAnim 1s linear infinite alternate; }
        @keyframes scanAnim { 0% { top: 30%; } 100% { top: 70%; } }

        .hand-icon {
            width: 40%; height: 40%; fill: transparent; stroke: white; stroke-width: 1.5;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            transition: transform 0.2s, stroke 0.2s, filter 0.2s; z-index: 4;
        }
        .hold-btn-container:active .hand-icon { stroke: var(--neon-blue); filter: drop-shadow(0 0 20px var(--neon-blue)); transform: scale(0.95); }
        .hold-btn-container.success .hand-icon { stroke: var(--neon-green); filter: drop-shadow(0 0 40px var(--neon-green)); }

        .scan-text {
            position: absolute; 
            bottom: -50px; 
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(0.8rem, 1vw, 1rem); 
            color: var(--neon-blue); 
            text-shadow: 0 0 5px var(--neon-blue);
            letter-spacing: 2px; 
            opacity: 0; 
            transition: opacity 0.3s; 
            pointer-events: none; 
            white-space: nowrap;
            width: 100%;
            text-align: center;
        }
        .hold-btn-container.scanning .scan-text { opacity: 1; }
        .hold-btn-container.success .scan-text { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }

        /* --- GAME UI --- */
        #question-text { font-family: 'Rajdhani', sans-serif; font-size: clamp(1.8rem, 2.5vw, 2.5rem); margin-bottom: 30px; font-weight: 600; text-shadow: var(--text-glow); }
        
        .timer-container { width: 100%; height: 8px; background: #111; overflow: hidden; margin-bottom: 40px; position: relative; border-radius: 4px; }
        .timer-bar { width: 100%; height: 100%; background: var(--neon-blue); transition: width 0.1s linear, background-color 0.3s; box-shadow: 0 0 10px var(--neon-blue); }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; }
        .option-btn { background: rgba(0, 85, 255, 0.05); border: 1px solid rgba(0, 225, 255, 0.2); color: #eee; padding: 20px 25px; font-family: 'Rajdhani', sans-serif; font-size: clamp(1.2rem, 1.5vw, 1.6rem); font-weight: 500; border-radius: 5px; cursor: pointer; transition: all 0.2s; text-align: left; display: flex; align-items: center; }
        .option-btn:hover { background: rgba(0, 85, 255, 0.2); border-color: var(--neon-blue); transform: translateX(5px); }
        .option-btn span { font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); margin-right: 20px; font-size: 1em; border: 1px solid rgba(0, 225, 255, 0.3); padding: 5px 10px; border-radius: 3px; }
        .option-btn:active { transform: scale(0.99); background: var(--gemcor-blue); }
        
        .flash-correct { background: rgba(0, 255, 136, 0.2) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; box-shadow: 0 0 30px rgba(0, 255, 136, 0.3) !important; }
        .flash-wrong { background: rgba(255, 0, 60, 0.2) !important; border-color: var(--danger) !important; color: white !important; box-shadow: 0 0 30px rgba(255, 0, 60, 0.3) !important; }

        /* --- RESULTS UI --- */
        #result-screen h1 { font-size: clamp(3rem, 5vw, 5rem); margin: 0; font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 5px; }
        .correct-text { color: var(--neon-green); text-shadow: 0 0 20px var(--neon-green); }
        .wrong-text { color: var(--danger); text-shadow: 0 0 20px var(--danger); }
        .timeout-text { color: var(--warning); text-shadow: 0 0 20px var(--warning); }
        
        .btn { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 15px 40px; font-family: 'Orbitron', sans-serif; font-size: clamp(1rem, 1.2vw, 1.2rem); font-weight: 700; border-radius: 5px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; margin-top: 40px; position: relative; overflow: hidden; }
        .btn:hover { background: rgba(0, 225, 255, 0.1); box-shadow: 0 0 20px rgba(0, 225, 255, 0.3); }
        .btn:active { background: var(--neon-blue); color: black; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- BACKGROUND AUDIO ELEMENT (Naka-loop) -->
    <audio id="bgMusic" loop>
        <!-- Ito ay isang base64 encoded na synth hum. Pwede mong palitan ito ng link ng sarili mong MP3 pag may na-download ka na. -->
        <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
    </audio>

    <canvas id="bg-canvas"></canvas>
    <canvas id="fx-canvas" style="z-index: 6; pointer-events: none;"></canvas>
    <div id="glitch-overlay"></div>

    <button class="settings-btn" onclick="toggleSettings()">⚙</button>
    <div id="settings-modal">
        <h2>SYSTEM CONFIG</h2>
        <div class="setting-item">
            <span>AUDIO LEVEL</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.3">
        </div>
        <div class="setting-item">
            <span>HAPTIC FEEDBACK</span>
            <label class="switch">
                <input type="checkbox" id="vibrate-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <button class="close-btn" onclick="toggleSettings()">CLOSE</button>
    </div>

    <div class="container" id="main-container">
        <div class="logo-container">
            <img src="https://github.com/erwinivmgemcor/GEMCOR-IIEE/blob/main/gemcor-logo.png?raw=true" alt="GEMCOR Logo">
        </div>

        <div id="attract-screen">
            <h1>KNOWLEDGE <span class="subtitle">ASSESSMENT</span></h1>
            
            <div class="hold-btn-container" id="hold-btn">
                <div class="scan-text" id="scan-text">AWAITING TOUCH...</div>

                <div class="hud-ring-outer"></div>
                <div class="hud-ring-inner"></div>
                <div class="laser-scanner"></div>

                <svg class="progress-ring" viewBox="0 0 320 320">
                    <circle class="progress-ring__circle" stroke="var(--neon-blue)" stroke-width="4" fill="transparent" r="140" cx="160" cy="160" />
                </svg>
                
                <svg class="hand-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v5M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v6M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            
        </div>

        <div id="game-screen" class="hidden" style="width: 100%;">
            <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
            <h2 style="color: var(--neon-blue); font-family: 'Share Tech Mono'; font-size: clamp(0.8rem, 1vw, 1rem); letter-spacing: 3px; margin-top:0; text-align: left;">// ASSESSMENT_START</h2>
            <div id="question-text">Loading...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h1 id="result-text">CORRECT</h1>
            <p id="result-subtext" style="font-size: clamp(1rem, 1.2vw, 1.5rem); color: #ccc; margin-top: 20px; font-family: 'Share Tech Mono';">Claim your prize at the booth.</p>
            <button class="btn" onclick="resetGame()">NEXT SUBJECT</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. GLOBAL SETTINGS & AUDIO
        // ==========================================
        let masterVolume = 0.3; // Default volume
        let isVibrateEnabled = true;
        const bgMusic = document.getElementById('bgMusic');
        
        // Set initial volume ng background music
        bgMusic.volume = masterVolume;

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        document.getElementById('volume-slider').addEventListener('input', (e) => {
            masterVolume = parseFloat(e.target.value);
            bgMusic.volume = masterVolume; // I-update ang HTML5 audio volume
        });

        document.getElementById('vibrate-toggle').addEventListener('change', (e) => { isVibrateEnabled = e.target.checked; });

        function triggerVibrate(pattern) {
            if (isVibrateEnabled && navigator.vibrate) navigator.vibrate(pattern);
        }

        // ==========================================
        // 2. BACKGROUND CANVAS
        // ==========================================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [], pulses = [];
        const PARTICLE_COUNT = 80, CONNECTION_DISTANCE = 150;

        function initCanvas() {
            width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width; this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.8; this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1.5; this.baseColor = Math.random() > 0.3 ? '#0055ff' : '#00ff88';
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.baseColor; ctx.shadowBlur = 15; ctx.shadowColor = this.baseColor; ctx.fill(); ctx.shadowBlur = 0; 
            }
        }

        class Pulse {
            constructor(x, y) {
                this.x = x; this.y = y; this.radius = 0; this.maxRadius = Math.random() * 150 + 100;
                this.opacity = 1; this.speed = 4; this.color = Math.random() > 0.5 ? '0, 255, 136' : '0, 225, 255';
            }
            update() { this.radius += this.speed; this.opacity -= 0.03; }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${this.color}, ${this.opacity})`; ctx.lineWidth = 2; ctx.stroke(); ctx.shadowBlur = 0;
            }
        }

        function animateCanvas() {
            ctx.fillStyle = 'rgba(2, 6, 10, 0.3)'; ctx.fillRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < CONNECTION_DISTANCE) {
                        ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 85, 255, ${(1 - (distance / CONNECTION_DISTANCE)) * 0.6})`; ctx.lineWidth = 1; ctx.stroke();
                    }
                }
            }
            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update(); pulses[i].draw();
                if (pulses[i].opacity <= 0) pulses.splice(i, 1);
            }
            requestAnimationFrame(animateCanvas);
        }

        function createPulse(e) {
            if(e.target.closest('#settings-modal') || e.target.closest('.settings-btn') || e.target.closest('.hold-btn-container')) return;
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            let y = e.touches ? e.touches[0].clientY : e.clientY;
            pulses.push(new Pulse(x, y));
            setTimeout(() => pulses.push(new Pulse(x, y)), 100);
            particles.forEach(p => {
                const dx = p.x - x, dy = p.y - y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) { p.vx += (dx / dist) * 2; p.vy += (dy / dist) * 2; }
            });
            triggerVibrate(20); 
        }

        window.addEventListener('mousedown', createPulse); window.addEventListener('touchstart', createPulse);
        window.addEventListener('resize', initCanvas); initCanvas(); animateCanvas();

        // ==========================================
        // 3. CONFETTI EFFECT
        // ==========================================
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        let confetti = [], isConfettiActive = false;
        function resizeFx() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeFx); resizeFx();

        class ConfettiPiece {
            constructor() {
                this.x = Math.random() * fxCanvas.width; this.y = -20;
                this.size = Math.random() * 8 + 4; this.speedY = Math.random() * 4 + 2; this.speedX = (Math.random() - 0.5) * 3;
                this.color = ['#00ff88', '#0055ff', '#00e1ff', '#ffffff'][Math.floor(Math.random() * 4)];
                this.rotation = Math.random() * 360; this.rotSpeed = (Math.random() - 0.5) * 10;
            }
            update() { this.y += this.speedY; this.x += this.speedX; this.rotation += this.rotSpeed; }
            draw() {
                fxCtx.save(); fxCtx.translate(this.x, this.y); fxCtx.rotate(this.rotation * Math.PI / 180);
                fxCtx.fillStyle = this.color; fxCtx.shadowBlur = 10; fxCtx.shadowColor = this.color;
                fxCtx.fillRect(-this.size/2, -this.size/2, this.size, this.size); fxCtx.restore();
            }
        }

        function startConfetti() {
            confetti = []; isConfettiActive = true;
            for (let i = 0; i < 150; i++) confetti.push(new ConfettiPiece());
            animateConfetti();
        }

        function animateConfetti() {
            if (!isConfettiActive) return;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            confetti.forEach(p => { p.update(); p.draw(); });
            confetti = confetti.filter(p => p.y < fxCanvas.height);
            if (confetti.length > 0) requestAnimationFrame(animateConfetti);
            else { isConfettiActive = false; fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
        }

        // ==========================================
        // 4. SOUND EFFECTS (SFX ONLY)
        // ==========================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // Dito natin i-trigger ang background music playback
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Playback blocked:", e));
            }
        }

        function playCorrectSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); 
            gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
            osc.start(); osc.stop(audioCtx.currentTime + 1.0);
        }

        function playWrongSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'square';
            osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
            gain.gain.setValueAtTime(masterVolume * 0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        function playSuccessBootSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        // ==========================================
        // 5. HOLD-TO-START LOGIC 
        // ==========================================
        const holdBtn = document.getElementById('hold-btn');
        const progressCircle = document.querySelector('.progress-ring__circle');
        const scanText = document.getElementById('scan-text');
        
        let holdTimer = null;
        let holdProgress = 0;
        const HOLD_DURATION = 2000; 
        const INTERVAL = 30; 
        
        const ringRadius = 140;
        const ringCircumference = 2 * Math.PI * ringRadius; 
        
        progressCircle.style.strokeDasharray = `${ringCircumference}`;
        progressCircle.style.strokeDashoffset = `${ringCircumference}`;

        function startHold(e) {
            if(attractScreen.classList.contains('hidden')) return;
            e.preventDefault(); 
            
            // DITO TINATAWAG ANG AUDIO INIT PARA TUMUNOG ANG BACKGROUND MUSIC
            initAudio();

            holdProgress = 0;
            triggerVibrate(20);
            holdBtn.classList.add('scanning');
            scanText.innerText = "DECRYPTING_BIO_SIG...";

            if(holdTimer) clearInterval(holdTimer);

            holdTimer = setInterval(() => {
                holdProgress += INTERVAL;
                const offset = ringCircumference - (holdProgress / HOLD_DURATION) * ringCircumference;
                progressCircle.style.strokeDashoffset = offset;

                if (holdProgress > HOLD_DURATION * 0.6) {
                    scanText.innerText = "VERIFYING_CLEARANCE...";
                }

                if (holdProgress >= HOLD_DURATION) {
                    clearInterval(holdTimer);
                    holdTimer = null;
                    completeHold();
                }
            }, INTERVAL);
        }

        function endHold() {
            if (holdTimer) {
                clearInterval(holdTimer);
                holdTimer = null;
                progressCircle.style.strokeDashoffset = ringCircumference;
                holdBtn.classList.remove('scanning');
                scanText.innerText = "AWAITING TOUCH...";
            }
        }

        function completeHold() {
            holdBtn.classList.remove('scanning');
            holdBtn.classList.add('success');
            scanText.innerText = "ACCESS_GRANTED";
            
            triggerVibrate([100, 50, 200]);
            playSuccessBootSound();
            
            setTimeout(() => {
                holdBtn.classList.remove('success');
                progressCircle.style.strokeDashoffset = ringCircumference; 
                startGame();
            }, 800); 
        }

        holdBtn.addEventListener('mousedown', startHold);
        holdBtn.addEventListener('touchstart', startHold, {passive: false}); 
        holdBtn.addEventListener('mouseup', endHold);
        holdBtn.addEventListener('mouseleave', endHold);
        holdBtn.addEventListener('touchend', endHold);
        holdBtn.addEventListener('touchcancel', endHold);

        // ==========================================
        // 6. GAME LOGIC & TIMER
        // ==========================================
        const questions = [
            { q: "What does IIEE stand for?", o: ["Institute of Integrated Electrical Engineers", "International Institute of Electrical Engineering", "Integrated Institute of Electronic Engineers", "Institute of Industrial Electrical Engineers"], a: 0 },
            { q: "Which of the following is the unit of electrical resistance?", o: ["Volt", "Ampere", "Ohm", "Watt"], a: 2 },
            { q: "What is the color of the live wire in standard electrical wiring?", o: ["Black", "Green", "White", "Red or Brown"], a: 3 },
            { q: "Who discovered the principle of electromagnetic induction?", o: ["Thomas Edison", "Nikola Tesla", "Michael Faraday", "James Watt"], a: 2 },
            { q: "What is the standard frequency of AC power in the Philippines?", o: ["50 Hz", "60 Hz", "70 Hz", "100 Hz"], a: 1 }
        ];

        let currentQuestion = null;
        let timerInterval = null;
        let timeLeft = 15;
        const MAX_TIME = 15;

        const attractScreen = document.getElementById('attract-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const resultText = document.getElementById('result-text');
        const resultSubtext = document.getElementById('result-subtext');
        const mainContainer = document.getElementById('main-container');
        const glitchOverlay = document.getElementById('glitch-overlay');
        const timerBar = document.getElementById('timer-bar');

        function startGame() {
            // Siguraduhing tumutugtog ang music pag start ng game
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Playback blocked:", e));
            }
            
            attractScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            const randomIndex = Math.floor(Math.random() * questions.length);
            currentQuestion = questions[randomIndex];
            loadQuestion();
        }

        function loadQuestion() {
            resultScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            mainContainer.classList.remove('shake', 'glitch-bg', 'success-bg');
            glitchOverlay.style.opacity = 0;
            
            questionText.innerText = "";
            let i = 0;
            const txt = currentQuestion.q;
            function typeWriter() {
                if (i < txt.length) { questionText.innerHTML += txt.charAt(i); i++; setTimeout(typeWriter, 15); }
            }
            typeWriter();
            
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            setTimeout(() => {
                currentQuestion.o.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.id = `opt-${index}`;
                    btn.innerHTML = `<span>[${letters[index]}]</span> ${option}`;
                    btn.onclick = () => checkAnswer(index);
                    optionsContainer.appendChild(btn);
                });
            }, 500); 

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = MAX_TIME;
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = 'var(--neon-blue)';
            timerBar.style.boxShadow = '0 0 10px var(--neon-blue)';

            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const percentage = (timeLeft / MAX_TIME) * 100;
                timerBar.style.width = `${percentage}%`;

                if (timeLeft <= 5) {
                    timerBar.style.backgroundColor = 'var(--danger)';
                    timerBar.style.boxShadow = '0 0 10px var(--danger)';
                    if (Math.abs(timeLeft - Math.round(timeLeft)) < 0.05 && Math.round(timeLeft) > 0) playTickSound();
                } else if (timeLeft <= 10) {
                    timerBar.style.backgroundColor = 'var(--warning)';
                    timerBar.style.boxShadow = '0 0 10px var(--warning)';
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timeOut();
                }
            }, 100);
        }

        function timeOut() {
            triggerVibrate([300, 100, 300]);
            playWrongSound();
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            resultText.innerText = "TIME'S UP";
            resultText.className = "timeout-text";
            resultSubtext.innerText = "Connection timed out. Protocol failed.";
            mainContainer.classList.add('shake', 'glitch-bg'); 
            
            const correctBtn = document.getElementById(`opt-${currentQuestion.a}`);
            if(correctBtn) correctBtn.classList.add('flash-correct');
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval); 
            triggerVibrate(30); 
            
            const selectedBtn = document.getElementById(`opt-${selectedIndex}`);
            const correctBtn = document.getElementById(`opt-${currentQuestion.a}`);

            setTimeout(() => {
                gameScreen.classList.add('hidden');
                resultScreen.classList.remove('hidden');

                if (selectedIndex === currentQuestion.a) {
                    playCorrectSound();
                    startConfetti();
                    triggerVibrate([100, 50, 100, 50, 200]); 
                    resultText.innerText = "CORRECT";
                    resultText.className = "correct-text";
                    resultSubtext.innerText = "Data accepted. Claim your prize at the GEMCOR booth.";
                    mainContainer.classList.add('success-bg');
                } else {
                    playWrongSound();
                    glitchOverlay.style.opacity = 1;
                    setTimeout(() => glitchOverlay.style.opacity = 0, 200);
                    triggerVibrate([200, 100, 200]); 
                    resultText.innerText = "INCORRECT";
                    resultText.className = "wrong-text";
                    resultSubtext.innerText = "Access denied. Better luck next time.";
                    mainContainer.classList.add('shake', 'glitch-bg'); 
                    if(correctBtn) correctBtn.classList.add('flash-correct');
                }
            }, 300);

            if(selectedBtn) {
                if (selectedIndex === currentQuestion.a) selectedBtn.classList.add('flash-correct');
                else selectedBtn.classList.add('flash-wrong');
            }
        }

        function resetGame() {
            clearInterval(timerInterval);
            resultScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            attractScreen.classList.remove('hidden');
            mainContainer.classList.remove('shake', 'glitch-bg', 'success-bg');
            glitchOverlay.style.opacity = 0;
            currentQuestion = null;
            isConfettiActive = false;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            triggerVibrate(20);
            progressCircle.style.strokeDashoffset = ringCircumference;
            // Hindi natin pinapatay ang music para tuloy-tuloy ang vibe
        }
    </script>
</body>
</html>
